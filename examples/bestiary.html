.sy-root.sy-embedded{position:absolute}

.sy-text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.25}

.sy-btn:hover{background:#8250bf}.sy-btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #1d1630}
.sy-click{cursor:pointer}
.sy-stage:focus,.sy-root:focus,.sy-text:focus{outline:none}
.sy-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sy-click:focus-visible,.sy-btn:focus-visible{outline:4px solid #ffb000;outline-offset:2px}

us, Latin for 'foolish fire'\nLook for: a flickering light over boggy ground\nScience says: maybe gas from rotting plants, burning\nSee it in: The Lantern Road and The Haunted House","fontSize":22,"bold":false,"align":"left","tone":"panel"},{"kind":"text","id":"wisp_see","x":72,"y":414,"w":420,"h":44,"visible":true,"actions":[{"type":"goto","card":"jack"}],"motion":"none","text":"» See also: Stingy Jack","fontSize":22,"bold":false,"align":"left","tone":"dark"},{"kind":"button","id":"wisp_back","x":72,"y":470,"w":220,"h":60,"visible":true,"actions":[{"type":"goto","card":"spirits"}],"label":"« Spirits","motion":"none"},{"kind":"button","id":"wisp_next","x":308,"y":470,"w":280,"h":60,"visible":true,"actions":[{"type":"goto","card":"jack"}],"label":"Next: Stingy Jack","motion":"none"},{"kind":"button","id":"wisp_home","x":604,"y":470,"w":164,"h":60,"visible":true,"actions":[{"type":"goto","card":"contents"}],"label":"Contents","motion":"none"}]},{"id":"jack","name":"Stingy Jack","objects":[{"kind":"text","id":"jack_ch","x":72,"y":24,"w":400,"h":30,"visible":true,"actions":[],"motion":"none","text":"SPIRITS · 5 of 5","fontSize":20,"bold":false,"align":"left","tone":"dark"},{"kind":"text","id":"jack_t","x":72,"y":54,"w":420,"h":56,"visible":true,"actions":[],"motion":"none","text":"Stingy Jack","fontSize":40,"bold":true,"align":"left","tone":"dark"},{"kind":"image","id":"jack_img","asset":"b_jack","alt":"A sly man in a black hat holding up a glowing carved turnip","crisp":true,"x":528,"y":32,"w":224,"h":224,"visible":true,"actions":[],"motion":"none"},{"kind":"text","id":"jack_b","x":72,"y":120,"w":430,"h":150,"visible":true,"actions":[],"motion":"none","text":"Jack tricked the Devil, so when he died he could enter neither heaven nor hell. He wanders still, lighting his way with a coal in a turnip.","fontSize":24,"bold":false,"align":"left","tone":"dark"},{"kind":"text","id":"jack_facts","x":72,"y":276,"w":680,"h":128,"visible":true,"actions":[],"motion":"none","text":"From: an old Irish folk tale\nFirst lanterns: carved turnips and potatoes\nPumpkins: Irish families found them in America\nHis name: gave us the word jack-o'-lantern","fontSize":22,"bold":false,"align":"left","tone":"panel"},{"kind":"text","id":"jack_see","x":72,"y":414,"w":420,"h":44,"visible":true,"actions":[{"type":"goto","card":"wisp"}],"motion":"none","text":"» See also: Will-o'-the-wisp","fontSize":22,"bold":false,"align":"left","tone":"dark"},{"kind":"button","id":"jack_back","x":72,"y":470,"w":220,"h":60,"visible":true,"actions":[{"type":"goto","card":"spirits"}],"label":"« Spirits","motion":"none"},{"kind":"button","id":"jack_next","x":308,"y":470,"w":280,"h":60,"visible":true,"actions":[{"type":"goto","card":"ghost"}],"label":"Next: Ghost","motion":"none"},{"kind":"button","id":"jack_home","x":604,"y":470,"w":164,"h":60,"visible":true,"actions":[{"type":"goto","card":"contents"}],"label":"Contents","motion":"none"}]},{"id":"vampire","name":"Vampire","objects":[{"kind":"text","id":"vampire_ch","x":72,"y":24,"w":400,"h":30,"visible":true,"actions":[],"motion":"none","text":"THE UNDEAD · 1 of 4","fontSize":20,"bold":false,"align":"left","tone":"dark"},{"kind":"text","id":"vampire_t","x":72,"y":54,"w":420,"h":56,"visible":true,"actions":[],"motion":"none","text":"Vampire","fontSize":40,"bold":true,"align":"left","tone":"dark"},{"kind":"image","id":"vampire_img","asset":"b_vampire","alt":"A pale man in a high red-collared cape with red eyes and fangs","crisp":true,"x":528,"y":32,"w":224,"h":224,"visible":true,"actions":[],"motion":"none"},{"kind":"text","id":"vampire_b","x":72,"y":120,"w":430,"h":150,"visible":true,"actions":[],"motion":"none","text":"A corpse that rises at night to drink the blood of the living. The tales come from Eastern Europe; Count Dracula is from an 1897 novel.","fontSize":24,"bold":false,"align":"left","tone":"dark"},{"kind":"text","id":"vampire_facts","x":72,"y":276,"w":680,"h":128,"visible":true,"actions":[],"motion":"none","text":"From: Slavic and Balkan folklore\nWeak against: garlic, a wooden stake, running water\nSunlight: only deadly since a film of 1922\nReal: vampire bats exist, and they are tiny","fontSize":22,"bold":false,"align":"left","tone":"panel"},{"kind":"text","id":"vampire_see","x":72,"y":414,"w":420,"h":44,"visible":true,"actions":[{"type":"goto","card":"bat"}],"motion":"none","text":"» See also: Bat","fontSize":22,"bold":false,"align":"left","tone":"dark"},{"kind":"button","id":"vampire_back","x":72,"y":470,"w":220,"h":60,"visible":true,"actions":[{"type":"goto","card":"undead"}],"label":"« The Undead","motion":"none"},{"kind":"button","id":"vampire_next","x":308,"y":470,"w":280,"h":60,"visible":true,"actions":[{"type":"goto","card":"zombie"}],"label":"Next: Zombie","motion":"none"},{"kind":"button","id":"vampire_home","x":604,"y":470,"w":164,"h":60,"visible":true,"actions":[{"type":"goto","card":"contents"}],"label":"Contents","motion":"none"}]},{"id":"zombie","name":"Zombie","objects":[{"kind":"text","id":"zombie_ch","x":72,"y":24,"w":400,"h":30,"visible":true,"actions":[],"motion":"none","text":"THE UNDEAD · 2 of 4","fontSize":20,"bold":false,"align":"left","tone":"dark"},{"kind":"text","id":"zombie_t","x":72,"y":54,"w":420,"h":56,"visible":true,"actions":[],"motion":"none","text":"Zombie","fontSize":40,"bold":true,"align":"left","tone":"dark"},{"kind":"image","id":"zombie_img","asset":"b_zombie","alt":"A green-skinned zombie in a torn grey shirt, arms out","crisp":true,"x":528,"y":32,"w":224,"h":224,"visible":true,"actions":[],"motion":"none"},{"kind":"text","id":"zombie_b","x":72,"y":120,"w":430,"h":150,"visible":true,"actions":[],"motion":"none","text":"A dead body that walks again, without a mind of its own. The word comes from Haitian folklore; the hungry film zombie came much later.","fontSize":24,"bold":false,"align":"left","tone":"dark"},{"kind":"text","id":"zombie_facts","x":72,"y":276,"w":680,"h":128,"visible":true,"actions":[],"motion":"none","text":"From: Haiti (zonbi), from older West African beliefs\nFilm zombie: from Night of the Living Dead, 1968\nMoves: slowly... unless it is a newer film\nReal: a fungus turns some ants into 'zombie ants'","fontSize":22,"bold":false,"align":"left","tone":"panel"},{"kind":"text","id":"zombie_see","x":72,"y":414,"w":420,"h":44,"visible":true,"actions":[{"type":"goto","card":"mummy"}],"motion":"none","text":"» See also: Mummy","fontSize":22,"bold":false,"align":"left","tone":"dark"},{"kind":"button","id":"zombie_back","x":72,"y":470,"w":220,"h":60,"visible":true,"actions":[{"type":"goto","card":"undead"}],"label":"« The Undead","motion":"none"},{"kind":"button","id":"zombie_next","x":308,"y":470,"w":280,"h":60,"visible":true,"actions":[{"type":"goto","card":"mummy"}],"label":"Next: Mummy","motion":"none"},{"kind":"button","id":"zombie_home","x":604,"y":470,"w":164,"h":60,"visible":true,"actions":[{"type":"goto","card":"contents"}],"label":"Contents","motion":"none"}]},{"id":"mummy","name":"Mummy","objects":[{"kind":"text","id":"mummy_ch","x":72,"y":24,"w":400,"h":30,"visible":true,"actions":[],"motion":"none","text":"THE UNDEAD · 3 of 4","fontSize":20,"bold":false,"align":"left","tone":"dark"},{"kind":"text","id":"mummy_t","x":72,"y":54,"w":420,"h":56,"visible":true,"actions":[],"motion":"none","text":"Mummy","fontSize":40,"bold":true,"align":"left","tone":"dark"},{"kind":"image","id":"mummy_img","asset":"b_mummy","alt":"A figure wrapped in linen bandages with glowing eyes and a gold scarab","crisp":true,"x":528,"y":32,"w":224,"h":224,"visible":true,"actions":[],"motion":"none"},{"kind":"text","id":"mummy_b","x":72,"y":120,"w":430,"h":150,"visible":true,"actions":[],"motion":"none","text":"A body preserved after death. Ancient Egyptians dried the body with salt and wrapped it in linen, so the soul would always have a home.","fontSize":24,"bold":false,"align":"left","tone":"dark"},{"kind":"text","id":"mummy_facts","x":72,"y":276,"w":680,"h":128,"visible":true,"actions":[],"motion":"none","text":"From: Ancient Egypt, over 4,000 years ago\nMade with: natron salt, oils, and lots of linen\nThe curse: newspapers spread it after 1922\nReal: the organs were kept in four special jars","fontSize":22,"bold":false,"align":"left","tone":"panel"},{"kind":"text","id":"mummy_see","x":72,"y":414,"w":420,"h":44,"visible":true,"actions":[{"type":"goto","card":"skeleton"}],"motion":"none","text":"» See also: Skeleton","fontSize":22,"bold":false,"align":"left","tone":"dark"},{"kind":"button","id":"mummy_back","x":72,"y":470,"w":220,"h":60,"visible":true,"actions":[{"type":"goto","card":"undead"}],"label":"« The Undead","motion":"none"},{"kind":"button","id":"mummy_next","x":308,"y":470,"w":280,"h":60,"visible":true,"actions":[{"type":"goto","card":"skeleton"}],"label":"Next: Skeleton","motion":"none"},{"kind":"button","id":"mummy_home","x":604,"y":470,"w":164,"h":60,"visible":true,"actions":[{"type":"goto","card":"contents"}],"label":"Contents","motion":"none"}]},{"id":"skeleton","name":"Skeleton","objects":[{"kind":"text","id":"skeleton_ch","x":72,"y":24,"w":400,"h":30,"visible":true,"actions":[],"motion":"none","text":"THE UNDEAD · 4 of 4","fontSize":20,"bold":false,"align":"left","tone":"dark"},{"kind":"text","id":"skeleton_t","x":72,"y":54,"w":420,"h":56,"visible":true,"actions":[],"motion":"none","text":"Skeleton","fontSize":40,"bold":true,"align":"left","tone":"dark"},{"kind":"image","id":"skeleton_img","asset":"b_skeleton","alt":"A smiling skeleton waving, with a marigold flower","crisp":true,"x":528,"y":32,"w":224,"h":224,"visible":true,"actions":[],"motion":"none"},{"kind":"text","id":"skeleton_b","x":72,"y":120,"w":430,"h":150,"visible":true,"actions":[],"motion":"none","text":"The bones inside every one of us. At Halloween and on Mexico's Day of the Dead, skeletons remind us of the dead, often with a smile.","fontSize":24,"bold":false,"align":"left","tone":"dark"},{"kind":"text","id":"skeleton_facts","x":72,"y":276,"w":680,"h":128,"visible":true,"actions":[],"motion":"none","text":"Bones: an adult has 206; a baby has about 300\nStrongest: the thigh bone, called the femur\nDay of the Dead: Mexico, 1 and 2 November\nReal: your skeleton is alive and always renewing","fontSize":22,"bold":false,"align":"left","tone":"panel"},{"kind":"text","id":"skeleton_see","x":72,"y":414,"w":420,"h":44,"visible":true,"actions":[{"type":"goto","card":"reaper"}],"motion":"none","text":"» See also: The Grim Reaper","fontSize":22,"bold":false,"align":"left","tone":"dark"},{"kind":"button","id":"skeleton_back","x":72,"y":470,"w":220,"h":60,"visible":true,"actions":[{"type":"goto","card":"undead"}],"label":"« The Undead","motion":"none"},{"kind":"button","id":"skeleton_next","x":308,"y":470,"w":280,"h":60,"visible":true,"actions":[{"type":"goto","card":"vampire"}],"label":"Next: Vampire","motion":"none"},{"kind":"button","id":"skeleton_home","x":604,"y":470,"w":164,"h":60,"visible":true,"actions":[{"type":"goto","card":"contents"}],"label":"Contents","motion":"none"}]},{"id":"witch","name":"Witch","objects":[{"kind":"text","id":"witch_ch","x":72,"y":24,"w":400,"h":30,"visible":true,"actions":[],"motion":"none","text":"MAGIC FOLK · 1 of 4","fontSize":20,"bold":false,"align":"left","tone":"dark"},{"kind":"text","id":"witch_t","x":72,"y":54,"w":420,"h":56,"visible":true,"actions":[],"motion":"none","text":"Witch","fontSize":40,"bold":true,"align":"left","tone":"dark"},{"kind":"image","id":"witch_img","asset":"b_witch","alt":"A green-faced witch with orange hair, a crooked hat and a broom","crisp":true,"x":528,"y":32,"w":224,"h":224,"visible":true,"actions":[],"motion":"none"},{"kind":"text","id":"witch_b","x":72,"y":120,"w":430,"h":150,"visible":true,"actions":[],"motion":"none","text":"In old stories, a person who uses magic, often with a cat, a cauldron and a broom. In real history, innocent people were accused of it.","fontSize":24,"bold":false,"align":"left","tone":"dark"},{"kind":"text","id":"witch_facts","x":72,"y":276,"w":680,"h":128,"visible":true,"actions":[],"motion":"none","text":"From: folklore all over the world\nTools: cauldron, broomstick, book of spells\nCompanion: a 'familiar', often a black cat\nHistory: thousands were unfairly tried, 1450–1750","fontSize":22,"bold":false,"align":"left","tone":"panel"},{"kind":"text","id":"witch_see","x":72,"y":414,"w":420,"h":44,"visible":true,"actions":[{"type":"goto","card":"cat"}],"motion":"none","text":"» See also: Black Cat","fontSize":22,"bold":false,"align":"left","tone":"dark"},{"kind":"button","id":"witch_back","x":72,"y":470,"w":220,"h":60,"visible":true,"actions":[{"type":"goto","card":"magic"}],"label":"« Magic Folk","motion":"none"},{"kind":"button","id":"witch_next","x":308,"y":470,"w":280,"h":60,"visible":true,"actions":[{"type":"goto","card":"werewolf"}],"label":"Next: Werewolf","motion":"none"},{"kind":"button","id":"witch_home","x":604,"y":470,"w":164,"h":60,"visible":true,"actions":[{"type":"goto","card":"contents"}],"label":"Contents","motion":"none"}]},{"id":"werewolf","name":"Werewolf","objects":[{"kind":"text","id":"werewolf_ch","x":72,"y":24,"w":400,"h":30,"visible":true,"actions":[],"motion":"none","text":"MAGIC FOLK · 2 of 4","fontSize":20,"bold":false,"align":"left","tone":"dark"},{"kind":"text","id":"werewolf_t","x":72,"y":54,"w":420,"h":56,"visible":true,"actions":[],"motion":"none","text":"Werewolf","fontSize":40,"bold":true,"align":"left","tone":"dark"},{"kind":"image","id":"werewolf_img","asset":"b_werewolf","alt":"A shaggy brown wolf-man with yellow eyes and fangs","crisp":true,"x":528,"y":32,"w":224,"h":224,"visible":true,"actions":[],"motion":"none"},{"kind":"text","id":"werewolf_b","x":72,"y":120,"w":430,"h":150,"visible":true,"actions":[],"motion":"none","text":"A person who turns into a wolf, usually at the full moon. The idea is ancient: a Greek myth tells of a king turned into a wolf.","fontSize":24,"bold":false,"align":"left","tone":"dark"},{"kind":"text","id":"werewolf_facts","x":72,"y":276,"w":680,"h":128,"visible":true,"actions":[],"motion":"none","text":"From: ancient Greece (King Lycaon) and across Europe\nThe word: 'were' is Old English for 'man'\nWeak against: silver, in later stories\nScience word: lycanthropy, 'wolf-person'","fontSize":22,"bold":false,"align":"left","tone":"panel"},{"kind":"text","id":"werewolf_see","x":72,"y":414,"w":420,"h":44,"visible":true,"actions":[{"type":"goto","card":"kitsune"}],"motion":"none","text":"» See also: Kitsune","fontSize":22,"bold":false,"align":"left","tone":"dark"},{"kind":"button","id":"werewolf_back","x":72,"y":470,"w":220,"h":60,"visible":true,"actions":[{"type":"goto","card":"magic"}],"label":"« Magic Folk","motion":"none"},{"kind":"button","id":"werewolf_next","x":308,"y":470,"w":280,"h":60,"visible":true,"actions":[{"type":"goto","card":"goblin"}],"label":"Next: Goblin","motion":"none"},{"kind":"button","id":"werewolf_home","x":604,"y":470,"w":164,"h":60,"visible":true,"actions":[{"type":"goto","card":"contents"}],"label":"Contents","motion":"none"}]},{"id":"goblin","name":"Goblin","objects":[{"kind":"text","id":"goblin_ch","x":72,"y":24,"w":400,"h":30,"visible":true,"actions":[],"motion":"none","text":"MAGIC FOLK · 3 of 4","fontSize":20,"bold":false,"align":"left","tone":"dark"},{"kind":"text","id":"goblin_t","x":72,"y":54,"w":420,"h":56,"visible":true,"actions":[],"motion":"none","text":"Goblin","fontSize":40,"bold":true,"align":"left","tone":"dark"},{"kind":"image","id":"goblin_img","asset":"b_goblin","alt":"A small green goblin with big ears and a stolen gold coin","crisp":true,"x":528,"y":32,"w":224,"h":224,"visible":true,"actions":[],"motion":"none"},{"kind":"text","id":"goblin_b","x":72,"y":120,"w":430,"h":150,"visible":true,"actions":[],"motion":"none","text":"A small, mischievous creature of European folklore that lives in caves and old houses, stealing food and playing tricks.","fontSize":24,"bold":false,"align":"left","tone":"dark"},{"kind":"text","id":"goblin_facts","x":72,"y":276,"w":680,"h":128,"visible":true,"actions":[],"motion":"none","text":"From: medieval European folklore\nLikes: shiny things, tricks, other people's dinner\nCousins: hobgoblins, kobolds, brownies\nThe word: maybe from Greek kobalos, 'rogue'","fontSize":22,"bold":false,"align":"left","tone":"panel"},{"kind":"text","id":"goblin_see","x":72,"y":414,"w":420,"h":44,"visible":true,"actions":[{"type":"goto","card":"witch"}],"motion":"none","text":"» See also: Witch","fontSize":22,"bold":false,"align":"left","tone":"dark"},{"kind":"button","id":"goblin_back","x":72,"y":470,"w":220,"h":60,"visible":true,"actions":[{"type":"goto","card":"magic"}],"label":"« Magic Folk","motion":"none"},{"kind":"button","id":"goblin_next","x":308,"y":470,"w":280,"h":60,"visible":true,"actions":[{"type":"goto","card":"kitsune"}],"label":"Next: Kitsune","motion":"none"},{"kind":"button","id":"goblin_home","x":604,"y":470,"w":164,"h":60,"visible":true,"actions":[{"type":"goto","card":"contents"}],"label":"Contents","motion":"none"}]},{"id":"kitsune","name":"Kitsune","objects":[{"kind":"text","id":"kitsune_ch","x":72,"y":24,"w":400,"h":30,"visible":true,"actions":[],"motion":"none","text":"MAGIC FOLK · 4 of 4","fontSize":20,"bold":false,"align":"left","tone":"dark"},{"kind":"text","id":"kitsune_t","x":72,"y":54,"w":420,"h":56,"visible":true,"actions":[],"motion":"none","text":"Kitsune","fontSize":40,"bold":true,"align":"left","tone":"dark"},{"kind":"image","id":"kitsune_img","asset":"b_kitsune","alt":"A fox spirit with nine white-tipped tails fanned out behind her","crisp":true,"x":528,"y":32,"w":224,"h":224,"visible":true,"actions":[],"motion":"pulse"},{"kind":"text","id":"kitsune_b","x":72,"y":120,"w":430,"h":150,"visible":true,"actions":[],"motion":"none","text":"A fox spirit from Japanese folklore. It grows a new tail every hundred years, and can take human form to help or to trick people.","fontSize":24,"bold":false,"align":"left","tone":"dark"},{"kind":"text","id":"kitsune_facts","x":72,"y":276,"w":680,"h":128,"visible":true,"actions":[],"motion":"none","text":"From: Japan; China and Korea have fox spirits too\nTails: up to nine; more tails, more wisdom and power\nServes: Inari, the Shinto spirit of rice\nIn stories: its shadow gives it away","fontSize":22,"bold":false,"align":"left","tone":"panel"},{"kind":"text","id":"kitsune_see","x":72,"y":414,"w":420,"h":44,"visible":true,"actions":[{"type":"goto","card":"werewolf"}],"motion":"none","text":"» See also: Werewolf","fontSize":22,"bold":false,"align":"left","tone":"dark"},{"kind":"button","id":"kitsune_back","x":72,"y":470,"w":220,"h":60,"visible":true,"actions":[{"type":"goto","card":"magic"}],"label":"« Magic Folk","motion":"none"},{"kind":"button","id":"kitsune_next","x":308,"y":470,"w":280,"h":60,"visible":true,"actions":[{"type":"goto","card":"witch"}],"label":"Next: Witch","motion":"none"},{"kind":"button","id":"kitsune_home","x":604,"y":470,"w":164,"h":60,"visible":true,"actions":[{"type":"goto","card":"contents"}],"label":"Contents","motion":"none"}]},{"id":"cat","name":"Black Cat","objects":[{"kind":"text","id":"cat_ch","x":72,"y":24,"w":400,"h":30,"visible":true,"actions":[],"motion":"none","text":"REAL ANIMALS · 1 of 4","fontSize":20,"bold":false,"align":"left","tone":"dark"},{"kind":"text","id":"cat_t","x":72,"y":54,"w":420,"h":56,"visible":true,"actions":[],"motion":"none","text":"Black Cat","fontSize":40,"bold":true,"align":"left","tone":"dark"},{"kind":"image","id":"cat_img","asset":"b_black_cat","alt":"A black cat with yellow eyes and a collar with a bell","crisp":true,"x":528,"y":32,"w":224,"h":224,"visible":true,"actions":[],"motion":"none"},{"kind":"text","id":"cat_b","x":72,"y":120,"w":430,"h":150,"visible":true,"actions":[],"motion":"none","text":"A real cat, of course. In parts of Europe and America a black cat crossing your path is bad luck; in Britain and Japan it can be good luck.","fontSize":24,"bold":false,"align":"left","tone":"dark"},{"kind":"text","id":"cat_facts","x":72,"y":276,"w":680,"h":128,"visible":true,"actions":[],"motion":"none","text":"Real: yes, many breeds can be black\nUnlucky: an old idea linked to witch stories\nLucky: in Scotland, a black cat at your door\nSailors: kept black cats on board for luck","fontSize":22,"bold":false,"align":"left","tone":"panel"},{"kind":"text","id":"cat_see","x":72,"y":414,"w":420,"h":44,"visible":true,"actions":[{"type":"goto","card":"witch"}],"motion":"none","text":"» See also: Witch","fontSize":22,"bold":false,"align":"left","tone":"dark"},{"kind":"button","id":"cat_back","x":72,"y":470,"w":220,"h":60,"visible":true,"actions":[{"type":"goto","card":"animals"}],"label":"« Real Animals","motion":"none"},{"kind":"button","id":"cat_next","x":308,"y":470,"w":280,"h":60,"visible":true,"actions":[{"type":"goto","card":"bat"}],"label":"Next: Bat","motion":"none"},{"kind":"button","id":"cat_home","x":604,"y":470,"w":164,"h":60,"visible":true,"actions":[{"type":"goto","card":"contents"}],"label":"Contents","motion":"none"}]},{"id":"bat","name":"Bat","objects":[{"kind":"text","id":"bat_ch","x":72,"y":24,"w":400,"h":30,"visible":true,"actions":[],"motion":"none","text":"REAL ANIMALS · 2 of 4","fontSize":20,"bold":false,"align":"left","tone":"dark"},{"kind":"text","id":"bat_t","x":72,"y":54,"w":420,"h":56,"visible":true,"actions":[],"motion":"none","text":"Bat","fontSize":40,"bold":true,"align":"left","tone":"dark"},{"kind":"image","id":"bat_img","asset":"b_bat","alt":"A brown bat with purple wings spread","crisp":true,"x":528,"y":32,"w":224,"h":224,"visible":true,"actions":[],"motion":"bob"},{"kind":"text","id":"bat_b","x":72,"y":120,"w":430,"h":150,"visible":true,"actions":[],"motion":"none","text":"The only mammal that can truly fly. Most bats eat insects or fruit; only three kinds out of more than 1,400 drink blood.","fontSize":24,"bold":false,"align":"left","tone":"dark"},{"kind":"text","id":"bat_facts","x":72,"y":276,"w":680,"h":128,"visible":true,"actions":[],"motion":"none","text":"Real: yes, about a fifth of all mammal species\nFinds its way by: sound echoes (echolocation)\nVampire bats: three kinds, in the Americas\nHelpers: bats eat pests and spread seeds","fontSize":22,"bold":false,"align":"left","tone":"panel"},{"kind":"text","id":"bat_see","x":72,"y":414,"w":420,"h":44,"visible":true,"actions":[{"type":"goto","card":"vampire"}],"motion":"none","text":"» See also: Vampire","fontSize":22,"bold":false,"align":"left","tone":"dark"},{"kind":"button","id":"bat_back","x":72,"y":470,"w":220,"h":60,"visible":true,"actions":[{"type":"goto","card":"animals"}],"label":"« Real Animals","motion":"none"},{"kind":"button","id":"bat_next","x":308,"y":470,"w":280,"h":60,"visible":true,"actions":[{"type":"goto","card":"spider"}],"label":"Next: Spider","motion":"none"},{"kind":"button","id":"bat_home","x":604,"y":470,"w":164,"h":60,"visible":true,"actions":[{"type":"goto","card":"contents"}],"label":"Contents","motion":"none"}]},{"id":"spider","name":"Spider","objects":[{"kind":"text","id":"spider_ch","x":72,"y":24,"w":400,"h":30,"visible":true,"actions":[],"motion":"none","text":"REAL ANIMALS · 3 of 4","fontSize":20,"bold":false,"align":"left","tone":"dark"},{"kind":"text","id":"spider_t","x":72,"y":54,"w":420,"h":56,"visible":true,"actions":[],"motion":"none","text":"Spider","fontSize":40,"bold":true,"align":"left","tone":"dark"},{"kind":"image","id":"spider_img","asset":"b_spider","alt":"A black spider with red markings hanging from a thread","crisp":true,"x":528,"y":32,"w":224,"h":224,"visible":true,"actions":[],"motion":"swing"},{"kind":"text","id":"spider_b","x":72,"y":120,"w":430,"h":150,"visible":true,"actions":[],"motion":"none","text":"Not an insect: spiders have eight legs and are arachnids. Almost all are harmless to people, and they eat a lot of pests.","fontSize":24,"bold":false,"align":"left","tone":"dark"},{"kind":"text","id":"spider_facts","x":72,"y":276,"w":680,"h":128,"visible":true,"actions":[],"motion":"none","text":"Real: yes, about 50,000 known species\nLegs: eight, and most sdom","fontSize":22,"bold":false,"align":"left","tone":"panel"},{"kind":"text","id":"owl_see","x":72,"y":414,"w":420,"h":44,"visible":true,"actions":[{"type":"goto","card":"bat"}],"motion":"none","text":"» See also: Bat","fontSize":22,"bold":false,"align":"left","tone":"dark"},{"kind":"button","id":"owl_back","x":72,"y":470,"w":220,"h":60,"visible":true,"actions":[{"type":"goto","card":"animals"}],"label":"« Real Animals","motion":"none"},{"kind":"button","id":"owl_next","x":308,"y":470,"w":280,"h":60,"visible":true,"actions":[{"type":"goto","card":"cat"}],"label":"Next: Black Cat","motion":"none"},{"kind":"button","id":"owl_home","x":604,"y":470,"w":164,"h":60,"visible":true,"actions":[{"type":"goto","card":"contents"}],"label":"Contents","motion":"none"}]}],"assets":{"b_cover":{"mime":"image/png","data":"iVBORw0KGgoAAAANSUhEUgAAAyAAAAJYCAYAAACadoJwAAAyUElEQVR42u3doa5kx3aA4QuHDDsyGMv0aJQBNjAaKSwmDUaGwaZDjM1N/Fyj0DA/QqTAKA9wAq+6HJ81q1dV7aq9P/CjctnHu7t319fS6v7H2zdPL5IkSZI0o3+4CJIkSZIARJIkSRKASJIkSdIwgPzrv7y7K/sf+Pbp+S777bd/n/1e//bbb7/7h/3229/79Q8g9ttvv9e//fbb7/5hv/32A4j99tvvAGG//fa7f7j+9tsPIB4A++13A3H97LfffvcP++23fxxAJEmSJMm3YEmSJEkCEEmSJEkCEEmSJEnHAyQaEonWoyEV69at77vu/mDdunX3B+vWrfceUgcQ69atO2BYt27d/cG6desAYt26dQcM69atuz9Yt24dQFxg69YdMNwfrFu37v5g3br1xwFiEEaSJEmSb8GSJEmSBCCSJEmSBCCSJEmS9geIITLr1g2ZGjK1bt26+4N169a/tuj1DyDWrVt3wLBu3br7g3Xr1gHEunXrDhjWrVt3f7Bu3TqAeACsW3fAcH+wbt26+4N16wAyDiCzq/4P22+//fbbb7/98/dHBw7Xz377z7t/+2/B8gSw33777bfffgCx3377AQRA7Lfffvvtt99+ALHffvsBxH777bfffvvtBxD77bd/I4AYIrNu3bohU+tXHJJ8fv/zXdl194dz3x+ivv/tdtdu/39/fPh4V+9196e9n9+fvnm+K7sOINatW3fAsO4NFkDcHwAEQKwDiHXr1h0wrFsHEPcHAAEQ6wDigGHdunUAsQ4gAAIgAAIgADIOIKsNoRvysd+Q1t/33e2HuwyZ5vbffvz1Ls/fa+2PQOH62V8Bx+j//ufbh7uy+yMwjN7v+Xft8wuA2G8/gAAIgAAIgNgPIABiP4B4AtjvBQwgAGI/gNgPIABiP4AAiP32AwiAeP4CiOsHIAACIM4v8wBiyNT6a+vVG/LVh0AjUFTXrz5kGoEjWvf633v95c/Pd/VeP/r5awh97edP9b8fgWP310d0fth9yP/sz++qHwDEOoAACIAAiDdYAAEQAAEQ90cAsQ4gAAIgAGIdQAAEQAAEQADEA2gdQAAEQKwDCIAACIAACICMA8jsqj984gl3LDii9So4ovXq3zf6hrf7gWj1A8
